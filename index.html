
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AkyTube - Video Platform</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0f0f0f;color:white;
 font-family:Arial, sans-serif;
}
header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:12px 16px;background:#181818;
 border-bottom:1px solid #303030;
 position:sticky;top:0;z-index:20;
}
.logo{font-size:21px;font-weight:bold;cursor:pointer;white-space:nowrap}
.logo span{background:red;padding:5px 8px;border-radius:6px;margin-right:5px}
.search{
 width:40%;padding:10px 14px;border-radius:20px;
 background:#0f0f0f;border:1px solid #444;color:white;
}
.btn{
 background:#272727;color:white;border:1px solid #444;
 padding:9px 14px;border-radius:20px;cursor:pointer;
 font-weight:bold;
}
.btn:hover{background:#444}
.btn-red{background:red;border:0}
.btn-red:hover{background:#c00}
.wrap{display:flex}
aside{
 width:190px;background:#121212;min-height:calc(100vh - 60px);
 padding:12px;flex-shrink:0;border-right:1px solid #303030;
}
.nav{
 padding:13px;border-radius:8px;cursor:pointer;
 margin-bottom:5px;font-size:14px;
}
.nav:hover,.nav.active{background:#303030;font-weight:bold}
main{flex:1;padding:18px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
 background:#272727;color:white;border:0;
 padding:8px 16px;border-radius:9px;cursor:pointer;
}
.chip.active{background:white;color:black;font-weight:bold}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
 gap:17px;
}
.card{
 background:#181818;border:1px solid #303030;
 border-radius:12px;overflow:hidden;cursor:pointer;
 transition:.2s;
}
.card:hover{transform:translateY(-3px);border-color:#666}
.card img{
 width:100%;height:155px;object-fit:cover;background:#000;
}
.card-body{padding:12px}
.card-title{font-weight:bold;font-size:15px;line-height:1.4;margin-bottom:7px}
.card-sub{color:#aaa;font-size:12px}
#playerBox{display:none}
video{
 width:100%;max-height:68vh;background:black;
 border-radius:12px;
}
.p-bar{
 display:flex;justify-content:space-between;
 align-items:center;gap:12px;flex-wrap:wrap;
 padding:14px 0;border-bottom:1px solid #333;
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.comment{
 background:#202020;padding:12px;border-radius:9px;
 margin:8px 0;font-size:14px;
}
.modal{
 display:none;position:fixed;inset:0;
 background:#000d;z-index:50;
 align-items:center;justify-content:center;padding:15px;
}
.modal-card{
 width:100%;max-width:460px;max-height:92vh;
 overflow:auto;background:#1e1e1e;padding:20px;
 border-radius:14px;border:1px solid #444;
}
.field{margin-bottom:13px}
.field label{display:block;color:#ccc;font-size:13px;margin-bottom:6px}
.field input,.field select{
 width:100%;padding:10px;background:#111;
 color:white;border:1px solid #444;border-radius:8px;
}
#statusMsg{font-size:13px;margin-top:12px;word-break:break-word}
.empty{color:#aaa;padding:30px 5px}
@media(max-width:700px){
 aside{display:none}
 .search{width:35%;min-width:80px}
 header{padding:10px;gap:6px}
 .logo{font-size:16px}
 .btn{padding:8px;font-size:12px}
 main{padding:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
 .card img{height:110px}
}
</style>
</head>

<body>

<header>
 <div class="logo" onclick="showHome()"><span>▶</span>AkyTube</div>
 <input id="q" class="search" placeholder="Search videos..." oninput="drawGrid()">
 <div style="display:flex;gap:6px">
  <button class="btn btn-red" onclick="openModal()">+ Upload</button>
  <button class="btn" onclick="loadFromGitHub()">↻ Sync</button>
 </div>
</header>

<div class="wrap">

<aside>
 <div class="nav active" onclick="setTab('all',this)">🏠 Home</div>
 <div class="nav" onclick="setTab('trending',this)">🔥 Trending</div>
 <div class="nav" onclick="setTab('liked',this)">👍 Liked</div>
 <div class="nav" onclick="setTab('saved',this)">⏰ Watch Later</div>
</aside>

<main>

<div id="homeBox">

 <div class="chips">
  <button class="chip active" onclick="setCat('All',this)">All</button>
  <button class="chip" onclick="setCat('My Channel',this)">My Channel</button>
  <button class="chip" onclick="setCat('Tech',this)">Tech</button>
  <button class="chip" onclick="setCat('Music',this)">Music</button>
  <button class="chip" onclick="setCat('Gaming',this)">Gaming</button>
 </div>

 <div class="grid" id="grid"></div>
</div>

<div id="playerBox">

 <button class="btn" onclick="showHome()">← Back to Home</button>

 <div style="margin-top:15px">
  <video id="vid" controls playsinline></video>
 </div>

 <h2 id="pTitle"></h2>

 <div class="p-bar">
  <div>
   <strong id="pChan"></strong>
   <span id="pViews" style="color:#aaa;font-size:13px"></span>
  </div>

  <div class="actions">
   <button class="btn btn-red" id="subBtn" onclick="doSub()">Subscribe</button>
   <button class="btn" id="likeBtn" onclick="doLike()">👍 0</button>
   <button class="btn" id="saveBtn" onclick="doSave()">⏰ Save</button>
   <button class="btn" style="color:#f87171" onclick="doDelete()">🗑 Delete</button>
  </div>
 </div>

 <h3>Comments</h3>

 <div style="display:flex;gap:8px">
  <input id="cText" placeholder="Comment likhein..."
   style="flex:1;min-width:0;padding:10px;background:#181818;color:white;border:1px solid #444;border-radius:8px">
  <button class="btn btn-red" onclick="addCom()">Post</button>
 </div>

 <div id="cList"></div>

</div>
</main>
</div>

<!-- UPLOAD MODAL -->

<div class="modal" id="upModal">
 <div class="modal-card">

  <div style="display:flex;justify-content:space-between;align-items:center">
   <h3>Upload Video</h3>
   <button class="btn" onclick="closeModal()">✕</button>
  </div>

  <div class="field">
   <label>Video Title *</label>
   <input id="fTitle" placeholder="Video ka title likhein">
  </div>

  <div class="field">
   <label>Channel Name</label>
   <input id="fChan" value="My Channel">
  </div>

  <div class="field">
   <label>Category</label>
   <select id="fCat">
    <option>My Channel</option>
    <option>Tech</option>
    <option>Music</option>
    <option>Gaming</option>
   </select>
  </div>

  <div class="field">
   <label>Video File (Max 25MB)</label>
   <input type="file" id="fFile" accept="video/*">
  </div>

  <div class="field">
   <label>Direct MP4 Video URL (Optional)</label>
   <input type="url" id="fUrl" placeholder="https://example.com/video.mp4">
  </div>

  <div class="field">
   <label>Thumbnail URL (Optional)</label>
   <input type="url" id="fThumb" placeholder="https://example.com/image.jpg">
  </div>

  <button class="btn btn-red" style="width:100%" onclick="startUpload()">
   🚀 Upload Video
  </button>

  <div id="statusMsg"></div>
 </div>
</div>

<script>

// CONFIGURATION

const OWNER = 'Ashok-Kumar-Yadaw';
const REPO = 'akytube';
const BRANCH = 'main';

const FALLBACK_THUMB =
 'https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?w=600';

const sample = [
 {
  id:'v1',
  title:'Big Buck Bunny - Full HD Demo',
  channel:'AkyTube Official',
  category:'Tech',
  url:'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
  thumb:'https://peach.blender.org/wp-content/uploads/title_anouncement.jpg',
  views:1240,
  likes:85
 },
 {
  id:'v2',
  title:'Elephants Dream - Sci-Fi Short Film',
  channel:'My Channel',
  category:'My Channel',
  url:'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
  thumb:FALLBACK_THUMB,
  views:890,
  likes:64
 }
];

// DATA

function readData(key,fallback){
 try{
  const data=JSON.parse(localStorage.getItem(key));
  return data===null?fallback:data;
 }catch(e){
  return fallback;
 }
}

let list=readData('aky_list_v3',sample);
let likes=readData('aky_likes_v3',[]);
let saved=readData('aky_saved_v3',[]);
let subs=readData('aky_subs_v3',[]);
let coms=readData('aky_coms_v3',{});

let tab='all';
let cat='All';
let activeVid=null;
let temporaryUrls=[];

// SAVE DATA

function persist(){
 localStorage.setItem('aky_list_v3',JSON.stringify(list));
 localStorage.setItem('aky_likes_v3',JSON.stringify(likes));
 localStorage.setItem('aky_saved_v3',JSON.stringify(saved));
 localStorage.setItem('aky_subs_v3',JSON.stringify(subs));
 localStorage.setItem('aky_coms_v3',JSON.stringify(coms));
}

function getVideo(id){
 return list.find(v=>v.id===id);
}

// HOME

function showHome(){
 document.getElementById('homeBox').style.display='block';
 document.getElementById('playerBox').style.display='none';

 const vid=document.getElementById('vid');
 vid.pause();
 vid.removeAttribute('src');
 vid.load();

 activeVid=null;
 drawGrid();
}

// TABS

function setTab(value,el){
 tab=value;

 document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
 el.classList.add('active');

 showHome();
}

function setCat(value,el){
 cat=value;

 document.querySelectorAll('.chip').forEach(n=>n.classList.remove('active'));
 el.classList.add('active');

 drawGrid();
}

// VIDEO GRID

function drawGrid(){

 const grid=document.getElementById('grid');
 const query=document.getElementById('q').value.toLowerCase();

 const filtered=list.filter(v=>{

  const title=(v.title||'').toLowerCase();
  const channel=(v.channel||'').toLowerCase();

  const search=title.includes(query)||channel.includes(query);
  const category=cat==='All'||v.category===cat;

  const selected=
   tab==='all' ||
   (tab==='trending'&&(v.views||0)>=500) ||
   (tab==='liked'&&likes.includes(v.id)) ||
   (tab==='saved'&&saved.includes(v.id));

  return search&&category&&selected;
 });

 grid.innerHTML='';

 if(!filtered.length){
  grid.innerHTML='<div class="empty">No videos found 😔</div>';
  return;
 }

 filtered.forEach(v=>{

  const card=document.createElement('div');
  card.className='card';

  const img=document.createElement('img');
  img.src=v.thumb||FALLBACK_THUMB;
  img.alt=v.title||'Video';
  img.onerror=()=>{img.src=FALLBACK_THUMB};

  const body=document.createElement('div');
  body.className='card-body';

  const title=document.createElement('div');
  title.className='card-title';
  title.textContent=v.title;

  const sub=document.createElement('div');
  sub.className='card-sub';
  sub.textContent=
   (v.channel||'Unknown')+' • '+(v.views||0)+
   ' views • 👍 '+(v.likes||0);

  body.append(title,sub);
  card.append(img,body);

  card.onclick=()=>playVideo(v.id);

  grid.appendChild(card);
 });
}

// PLAY VIDEO

function playVideo(id){

 const v=getVideo(id);
 if(!v)return;

 activeVid=id;

 v.views=(v.views||0)+1;
 persist();

 document.getElementById('homeBox').style.display='none';
 document.getElementById('playerBox').style.display='block';

 const player=document.getElementById('vid');
 player.src=v.url;
 player.load();

 document.getElementById('pTitle').textContent=v.title;
 document.getElementById('pChan').textContent=v.channel;
 document.getElementById('pViews').textContent=
  ' • '+v.views+' views';

 updateButtons();
 drawComments();

 window.scrollTo({top:0,behavior:'smooth'});
}

// BUTTON STATES

function updateButtons(){

 const v=getVideo(activeVid);
 if(!v)return;

 document.getElementById('likeBtn').textContent=
  '👍 '+(v.likes||0)+(likes.includes(v.id)?' ✓':'');

 document.getElementById('saveBtn').textContent=
  saved.includes(v.id)?'✓ Saved':'⏰ Save';

 document.getElementById('subBtn').textContent=
  subs.includes(v.channel)?'Subscribed':'Subscribe';
}

// LIKE

function doLike(){

 const v=getVideo(activeVid);
 if(!v)return;

 if(likes.includes(v.id)){
  likes=likes.filter(x=>x!==v.id);
  v.likes=Math.max(0,(v.likes||0)-1);
 }else{
  likes.push(v.id);
  v.likes=(v.likes||0)+1;
 }

 persist();
 updateButtons();
 drawGrid();
}

// SAVE

function doSave(){

 if(!activeVid)return;

 if(saved.includes(activeVid)){
  saved=saved.filter(x=>x!==activeVid);
 }else{
  saved.push(activeVid);
 }

 persist();
 updateButtons();
}

// SUBSCRIBE

function doSub(){

 const v=getVideo(activeVid);
 if(!v)return;

 if(subs.includes(v.channel)){
  subs=subs.filter(x=>x!==v.channel);
 }else{
  subs.push(v.channel);
 }

 persist();
 updateButtons();
}

// DELETE

function doDelete(){

 const v=getVideo(activeVid);
 if(!v)return;

 if(!confirm('Are you sure you want to delete this video?'))return;

 list=list.filter(x=>x.id!==activeVid);
 likes=likes.filter(x=>x!==activeVid);
 saved=saved.filter(x=>x!==activeVid);
 delete coms[activeVid];

 persist();
 showHome();
}

// COMMENTS

function addCom(){

 const input=document.getElementById('cText');
 const value=input.value.trim();

 if(!value||!activeVid)return;

 if(!coms[activeVid])coms[activeVid]=[];

 coms[activeVid].push({
  text:value,
  date:new Date().toLocaleString()
 });

 input.value='';

 persist();
 drawComments();
}

function drawComments(){

 const box=document.getElementById('cList');
 box.innerHTML='';

 const arr=coms[activeVid]||[];

 if(!arr.length){
  box.innerHTML='<p style="color:#aaa">No comments yet.</p>';
  return;
 }

 arr.slice().reverse().forEach(c=>{

  const item=document.createElement('div');
  item.className='comment';

  const text=document.createElement('div');
  text.textContent=c.text;

  const date=document.createElement('small');
  date.style.color='#888';
  date.textContent=c.date||'';

  item.append(text,date);
  box.appendChild(item);
 });
}

// UPLOAD MODAL

function openModal(){
 document.getElementById('upModal').style.display='flex';
}

function closeModal(){
 document.getElementById('upModal').style.display='none';
}

function msg(text,error=false){
 const el=document.getElementById('statusMsg');
 el.style.color=error?'#f87171':'#4ade80';
 el.textContent=text;
}

// UPLOAD

function startUpload(){

 const title=document.getElementById('fTitle').value.trim();
 const channel=document.getElementById('fChan').value.trim()||'My Channel';
 const category=document.getElementById('fCat').value;
 const file=document.getElementById('fFile').files[0];
 const url=document.getElementById('fUrl').value.trim();
 const thumb=document.getElementById('fThumb').value.trim();

 if(!title){
  msg('Please enter video title.',true);
  return;
 }

 if(!file&&!url){
  msg('Please select a video file or enter a video URL.',true);
  return;
 }

 if(file&&file.size>25*1024*1024){
  msg('Video size must be less than 25MB.',true);
  return;
 }

 if(file&&file.type&&!file.type.startsWith('video/')){
  msg('Please select a valid video file.',true);
  return;
 }

 let videoUrl=url;

 if(file){
  videoUrl=URL.createObjectURL(file);
  temporaryUrls.push(videoUrl);
 }

 const video={
  id:'v'+Date.now(),
  title:title,
  channel:channel,
  category:category,
  url:videoUrl,
  thumb:thumb||FALLBACK_THUMB,
  views:0,
  likes:0,
  temporary:!!file
 };

 list.unshift(video);
 persist();

 document.getElementById('fTitle').value='';
 document.getElementById('fFile').value='';
 document.getElementById('fUrl').value='';
 document.getElementById('fThumb').value='';

 msg('Video added successfully!');

 drawGrid();

 setTimeout(closeModal,1000);
}

// GITHUB SYNC - PUBLIC REPOSITORY READ

async function loadFromGitHub(){

 const button=document.querySelector('header button:last-child');
 button.textContent='Syncing...';

 const githubURL=
  'https://raw.githubusercontent.com/'+
  OWNER+'/'+REPO+'/'+BRANCH+'/videos.json';

 try{

  const response=await fetch(githubURL+'?t='+Date.now());

  if(!response.ok){
   throw new Error('GitHub file not found or repository is private.');
  }

  const data=await response.json();

  if(!Array.isArray(data)){
   throw new Error('Invalid videos.json format.');
  }

  const remote=data.filter(v=>
   v.id&&v.title&&v.url
  );

  // Keep local-only uploads and add remote videos.
  const localOnly=list.filter(v=>v.temporary);

  const remoteIds=new Set(remote.map(v=>v.id));

  const otherLocal=list.filter(v=>
   !v.temporary&&!remoteIds.has(v.id)
  );

  list=[...localOnly,...remote,...otherLocal];

  persist();
  drawGrid();

  alert('GitHub Sync Successful!');

 }catch(error){
  alert('Sync Error: '+error.message);
 }finally{
  button.textContent='↻ Sync';
 }
}

// INITIALIZE

drawGrid();

// Release temporary video URLs when page closes.

window.addEventListener('beforeunload',()=>{
 temporaryUrls.forEach(url=>URL.revokeObjectURL(url));
});

</script>

</body>
</html>
