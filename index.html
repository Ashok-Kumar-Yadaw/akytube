<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AkyTube - Video Streaming Platform</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-sec: #181818;
      --bg-hover: #272727;
      --text: #f1f1f1;
      --text-muted: #aaaaaa;
      --accent: #ff0000;
      --border: #303030;
    }
    body.light {
      --bg: #ffffff;
      --bg-sec: #f9f9f9;
      --bg-hover: #e5e5e5;
      --text: #0f0f0f;
      --text-muted: #606060;
      --border: #dddddd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); transition: 0.2s; }

    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .left-nav { display: flex; align-items: center; gap: 14px; }
    .icon-btn {
      background: none; border: none; color: var(--text); font-size: 20px;
      cursor: pointer; padding: 6px 10px; border-radius: 50%;
    }
    .icon-btn:hover { background: var(--bg-hover); }
    .logo { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; cursor: pointer; }
    .logo span { background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 14px; }

    .search-box { display: flex; flex: 1; max-width: 520px; }
    .search-box input {
      width: 100%; padding: 8px 14px; border: 1px solid var(--border);
      border-radius: 20px 0 0 20px; background: var(--bg-sec); color: var(--text); outline: none;
    }
    .search-box button {
      padding: 8px 16px; border: 1px solid var(--border); border-left: none;
      border-radius: 0 20px 20px 0; background: var(--bg-hover); color: var(--text); cursor: pointer;
    }

    .right-nav { display: flex; align-items: center; gap: 8px; }
    .btn {
      padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-hover); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-primary:hover { opacity: 0.9; }

    .container { display: flex; min-height: calc(100vh - 58px); }
    aside {
      width: 220px; padding: 12px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px; flex-shrink: 0;
    }
    aside.collapsed { display: none; }
    .nav-item {
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; gap: 12px; font-size: 14px;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); font-weight: 600; }

    main { flex: 1; padding: 16px 20px; overflow-x: hidden; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; }
    .chip {
      padding: 6px 14px; border-radius: 8px; background: var(--bg-hover);
      cursor: pointer; font-size: 13px; white-space: nowrap; border: none; color: var(--text);
    }
    .chip.active { background: var(--text); color: var(--bg); font-weight: 600; }

    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px;
    }
    .card { cursor: pointer; border-radius: 12px; overflow: hidden; transition: 0.2s; }
    .thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
      border-radius: 12px; overflow: hidden;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge {
      position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.85);
      color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px;
    }
    .card-info { display: flex; gap: 10px; padding-top: 10px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: bold; flex-shrink: 0;
    }
    .meta h4 { font-size: 15px; margin-bottom: 4px; line-height: 1.3; }
    .meta p { font-size: 12px; color: var(--text-muted); }

    #playerView { display: none; }
    .player-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    video#mainVideo { width: 100%; max-height: 70vh; background: #000; border-radius: 12px; }
    .video-title { font-size: 19px; margin: 12px 0; }
    .channel-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .comments-box { margin-top: 16px; }
    .comment-input { display: flex; gap: 8px; margin: 10px 0 16px; }
    .comment-input input {
      flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-sec); color: var(--text);
    }
    .comment-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .up-next-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
    .up-next-item img { width: 140px; height: 80px; object-fit: cover; border-radius: 8px; background: #000; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      z-index: 200; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--bg-sec); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 480px; padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: var(--text-muted); }
    .form-group input, .form-group select {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text);
    }
    .status-box {
      margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 13px;
      background: var(--bg-hover); display: none; word-break: break-word;
    }

    @media (max-width: 850px) {
      .player-layout { grid-template-columns: 1fr; }
      aside { position: fixed; left: 0; top: 58px; bottom: 0; background: var(--bg); z-index: 90; }
    }
  </style>
</head>
<body>

<header>
  <div class="left-nav">
    <button class="icon-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo" onclick="goHome()"><span>▶</span> AkyTube</div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search videos..." onkeyup="renderVideos()" />
    <button onclick="renderVideos()">🔍</button>
  </div>
  <div class="right-nav">
    <button class="btn btn-primary" onclick="openUpload()">+ Upload</button>
    <button class="btn" onclick="syncFromGitHub()" title="Refresh from GitHub">↻ Sync</button>
    <button class="icon-btn" onclick="toggleTheme()">☀</button>
  </div>
</header>

<div class="container">
  <aside id="sidebar">
    <div class="nav-item active" onclick="setFilter('home', this)">🏠 Home</div>
    <div class="nav-item" onclick="setFilter('trending', this)">🔥 Trending</div>
    <div class="nav-item" onclick="setFilter('subs', this)">📺 Subscriptions</div>
    <div class="nav-item" onclick="setFilter('history', this)">📜 History</div>
    <div class="nav-item" onclick="setFilter('watchlater', this)">⏰ Watch Later</div>
    <div class="nav-item" onclick="setFilter('liked', this)">👍 Liked Videos</div>
  </aside>

  <main>
    <div id="homeView">
      <div class="chips" id="categoryChips">
        <button class="chip active" onclick="setCategory('All', this)">All</button>
        <button class="chip" onclick="setCategory('My Channel', this)">My Channel</button>
        <button class="chip" onclick="setCategory('Tech', this)">Tech</button>
        <button class="chip" onclick="setCategory('Music', this)">Music</button>
        <button class="chip" onclick="setCategory('Gaming', this)">Gaming</button>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>

    <div id="playerView">
      <button class="btn" style="margin-bottom:12px;" onclick="goHome()">← Back to Home</button>
      <div class="player-layout">
        <div>
          <video id="mainVideo" controls autoplay playsinline></video>
          <h2 class="video-title" id="pTitle"></h2>
          <div class="channel-bar">
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="avatar" id="pAvatar">A</div>
              <div>
                <div style="font-weight:600;" id="pChannel"></div>
                <div style="font-size:12px;color:var(--text-muted);" id="pViews"></div>
              </div>
              <button class="btn btn-primary" id="subBtn" onclick="toggleSub()">Subscribe</button>
            </div>
            <div class="actions">
              <button class="btn" id="likeBtn" onclick="toggleLike()">👍 0</button>
              <button class="btn" id="saveBtn" onclick="toggleWatchLater()">⏰ Save</button>
              <button class="btn" onclick="shareVideo()">🔗 Share</button>
              <button class="btn" style="color:#ff5555;" onclick="deleteCurrentVideo()">🗑 Delete</button>
            </div>
          </div>

          <div class="comments-box">
            <h3>Comments (<span id="commentCount">0</span>)</h3>
            <div class="comment-input">
              <input type="text" id="commentInput" placeholder="Add a comment..." />
              <button class="btn btn-primary" onclick="addComment()">Comment</button>
            </div>
            <div id="commentList"></div>
          </div>
        </div>

        <div>
          <h3 style="margin-bottom:12px;">Up Next</h3>
