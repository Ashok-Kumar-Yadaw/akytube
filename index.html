<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AkyTube</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f0f; color: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #181818; border-bottom: 1px solid #303030; position: sticky; top: 0; z-index: 20; gap: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #fff; cursor: pointer; display: flex; align-items: center; }
  .logo span { background: #ff0000; padding: 2px 8px; border-radius: 6px; margin-right: 6px; font-size: 14px; }
  .btn { background: #272727; color: #fff; border: 1px solid #404040; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { background: #383838; }
  .btn-red { background: #ff0000; border: none; }
  .btn-red:hover { background: #cc0000; }
  .search { padding: 8px 14px; border-radius: 20px; border: 1px solid #383838; background: #0f0f0f; color: #fff; width: 42%; outline: none; }
  .wrap { display: flex; }
  aside { width: 200px; background: #121212; min-height: calc(100vh - 58px); padding: 10px; border-right: 1px solid #282828; flex-shrink: 0; }
  .nav { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 14px; }
  .nav:hover, .nav.active { background: #272727; font-weight: bold; }
  main { flex: 1; padding: 16px; overflow-x: hidden; }
  .chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { background: #272727; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .chip.active { background: #fff; color: #000; font-weight: bold; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #181818; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #282828; transition: 0.2s; }
  .card:hover { transform: translateY(-2px); border-color: #444; }
  .card img { width: 100%; height: 155px; object-fit: cover; display: block; background: #000; }
  .card-body { padding: 12px; }
  .card-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
  .card-sub { font-size: 12px; color: #aaa; }
  #playerBox { display: none; }
  video { width: 100%; max-height: 68vh; background: #000; border-radius: 12px; }
  .p-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #303030; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 50; padding: 15px; }
  .modal-card { background: #1e1e1e; padding: 20px; border-radius: 14px; width: 100%; max-width: 450px; border: 1px solid #383838; max-height: 92vh; overflow-y: auto; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #ccc; margin-bottom: 5px; }
  .field input, .field select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; }
  #statusMsg { margin-top: 12px; font-size: 13px; color: #4ade80; word-break: break-word; line-height: 1.4; }
  @media (max-width: 700px) { aside { display: none; } .search { width: 36%; } }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showHome()"><span>▶</span>AkyTube</div>
  <input type="text" id="q" class="search" placeholder="Search videos..." oninput="drawGrid()">
  <div style="display:flex;gap:6px;">
    <button class="btn btn-red" onclick="openModal()">+ Upload</button>
    <button class="btn" onclick="loadFromGitHub()">↻ Sync</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="nav active" onclick="setTab('all', this)">🏠 Home</div>
    <div class="nav" onclick="setTab('trending', this)">🔥 Trending</div>
    <div class="nav" onclick="setTab('liked', this)">👍 Liked</div>
    <div class="nav" onclick="setTab('saved', this)">⏰ Watch Later</div>
  </aside>

  <main>
    <div id="homeBox">
      <div class="chips">
        <button class="chip active" onclick="setCat('All', this)">All</button>
        <button class="chip" onclick="setCat('My Channel', this)">My Channel</button>
        <button class="chip" onclick="setCat('Tech', this)">Tech</button>
        <button class="chip" onclick="setCat('Music', this)">Music</button>
        <button class="chip" onclick="setCat('Gaming', this)">Gaming</button>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div id="playerBox">
      <button class="btn" style="margin-bottom:12px;" onclick="showHome()">← Back to Home</button>
      <video id="vid" controls playsinline></video>
      <h2 id="pTitle" style="margin:12px 0 8px;"></h2>
      <div class="p-bar">
        <div>
          <strong id="pChan"></strong> • <span id="pViews" style="color:#aaa;font-size:13px;"></span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-red" id="subBtn" onclick="doSub()">Subscribe</button>
          <button class="btn" id="likeBtn" onclick="doLike()">👍 0</button>
          <button class="btn" id="saveBtn" onclick="doSave()">⏰ Save</button>
          <button class="btn" style="color:#f87171;" onclick="doDelete()">🗑 Delete</button>
        </div>
      </div>
      <div style="margin-top:16px;">
        <h4 style="margin:0 0 8px;">Comments</h4>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="text" id="cText" placeholder="Comment likhein..." style="flex:1;padding:9px;border-radius:8px;border:1px solid #444;background:#181818;color:#fff;">
          <button class="btn btn-red" onclick="addCom()">Post</button>
        </div>
        <div id="cList"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="upModal">
  <div class="modal-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="margin:0;">Upload Video</h3>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>Video Title *</label><input type="text" id="fTitle" placeholder="Video ka title likhein"></div>
    <div class="field"><label>Channel Name</label><input type="text" id="fChan" value="My Channel"></div>
    <div class="field"><label>Category</label>
      <select id="fCat"><option>My Channel</option><option>Tech</option><option>Music</option><option>Gaming</option></select>
    </div>
    <div class="field"><label>MP4 File Chunein (Max 25MB)</label><input type="file" id="fFile" accept="video/mp4,video/*"></div>
    <div class="field"><label>GitHub Token (Repo me save karne ke liye)</label><input type="password" id="fToken" placeholder="ghp_xxxxxxxxxxxx"></div>
    <div class="field"><label>Ya Direct MP4 URL</label><input type="url" id="fUrl" placeholder="https://example.com"></div>
    <div class="field"><label>Thumbnail URL (Khali chhodne par auto banega)</label><input type="url" id="fThumb" placeholder="https://..."></div>
    <button class="btn btn-red" style="width:100%;padding:11px;font-size:14px;" id="upBtn" onclick="startUpload()">🚀 Upload & Save</button>
    <div id="statusMsg"></div>
  </div>
</div>

<script>
  var OWNER = 'Ashok-Kumar-Yadaw';
  var REPO = 'akytube';
  var BRANCH = 'main';
  var FALLBACK_THUMB = 'https://unsplash.com';

  var sample = [
    {
      id: 'v1',
      title: 'Big Buck Bunny - Full HD Demo',
      channel: 'AkyTube Official',
      category: 'Tech',
      url: 'https://googleapis.com',
      thumb: 'https://unsplash.com',
      views: 1240,
      likes: 85
    },
    {
      id: 'v2',
      title: 'Elephants Dream - Sci-Fi Short Film',
      channel: 'My Channel',
      category: 'My Channel',
      url: 'https://googleapis.com',
      thumb: 'https://unsplash.com',
      views: 890,
      likes: 64
    }
  ];

  // Clear old broken keys automatically
  localStorage.removeItem('aky_list');
  localStorage.removeItem('akytube_videos');

  var list = JSON.parse(localStorage.getItem('aky_list_v3') || 'null') || sample;
  var likes = JSON.parse(localStorage.getItem('aky_likes_v3') || '[]');
  var saved = JSON.parse(localStorage.getItem('aky_saved_v3') || '[]');
  var subs = JSON.parse(localStorage.getItem('aky_subs_v3') || '[]');
  var coms = JSON.parse(localStorage.getItem('aky_coms_v3') || '{}');
  var tab = 'all';
  var cat = 'All';
  var activeVid = null;

  document.getElementById('fToken').value = localStorage.getItem('aky_tok') || '';

  function persist() {
    localStorage.setItem('aky_list_v3', JSON.stringify(list));
    localStorage.setItem('aky_likes_v3', JSON.stringify(likes));
    localStorage.setItem('aky_saved_v3', JSON.stringify(saved));
    localStorage.setItem('aky_subs_v3', JSON.stringify(subs));
    localStorage.setItem('aky_coms_v3', JSON.stringify(coms));
  }

  function msg(txt, err) {
    var el = document.getElementById('statusMsg');
    el.style.color = err ? '#f87171' : '#4ade80';
    el.innerText = txt;
  }

  function loadFromGitHub() {
    var u = 'https://githubusercontent.com' + OWNER + '/' + REPO + '/' + BRANCH + '/videos.json?t=' + Date.now();
    fetch(u).then(function(r) { return r.ok ? r.json() : null; }).then(function(data) {
      if (data && data.length > 0) {
        list = data;
        persist();
        drawGrid();
      }
    }).catch(function() {});
  }

  function drawGrid() {
