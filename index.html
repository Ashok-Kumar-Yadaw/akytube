<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AkyTube</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface-hover: #272727;
      --border: #2c2c2c;
      --text: #ffffff;
      --muted: #aaaaaa;
      --accent: #ff0000;
      --link: #3ea6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .logo-badge {
      background: var(--accent);
      color: #fff;
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.2;
    }

    .search-box {
      flex: 1;
      max-width: 520px;
      display: flex;
    }

    .search-box input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #121212;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--link);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #353535;
    }

    .btn-light {
      background: #ffffff;
      color: #0f0f0f;
    }

    .btn-danger {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-blue {
      background: var(--link);
      color: #0f0f0f;
    }

    /* Main Layout */
    main {
      max-width: 1380px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Categories */
    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: #ffffff;
      color: #0f0f0f;
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px;
    }

    .video-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .thumb-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #202020;
      aspect-ratio: 16 / 9;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Watch View */
    .watch-layout {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr);
      gap: 24px;
    }

    @media (max-width: 920px) {
      .watch-layout {
        grid-template-columns: 1fr;
      }
      .search-box {
        max-width: none;
      }
    }

    .player-box video {
      width: 100%;
      max-height: 540px;
      border-radius: 12px;
      background: #000;
    }

    .watch-title {
      font-size: 20px;
      font-weight: 700;
      margin-top: 14px;
      line-height: 1.35;
    }

    .watch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #303030;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
    }

    .desc-box {
      background: var(--surface);
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .comments-section {
      margin-top: 24px;
    }

    .comments-section h3 {
      margin-bottom: 14px;
      font-size: 17px;
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .comment-form input {
      flex: 1;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #121212;
      color: var(--text);
      font-size: 14px;
    }

    .comment-item {
      padding: 10px 0;
      border-bottom: 1px solid #202020;
    }

    .comment-user {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .comment-text {
      font-size: 14px;
      color: #e0e0e0;
    }

    .up-next {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .up-next-card {
      display: flex;
      gap: 10px;
      cursor: pointer;
    }

    .up-next-card img {
      width: 156px;
      height: 88px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 460px;
      background: #1c1c1c;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .modal input,
    .modal select,
    .modal textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" id="homeLogo">
      <span class="logo-badge">▶</span>
      <span>AkyTube</span>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Videos ya channels search karein..."
      />
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" id="openUploadBtn">+ Upload</button>
      <button class="btn btn-secondary" id="resetDataBtn" title="Default data reset karein">Reset</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Upload Modal -->
  <div class="modal-backdrop" id="uploadModal">
    <form class="modal" id="uploadForm">
      <h3>Naya Video Upload Karein</h3>

      <input type="text" id="videoTitle" placeholder="Video Title *" required />
      <input type="text" id="channelName" placeholder="Channel Name" value="My Channel" />

      <select id="videoCategory">
        <option value="Tech">Tech</option>
        <option value="Music">Music</option>
        <option value="Gaming">Gaming</option>
      </select>

      <label style="font-size: 12px; color: var(--muted);">
        Computer se MP4 video file chunein (ya neeche direct MP4 URL dein):
      </label>
      <input type="file" id="videoFileInput" accept="video/*" />
      <input
        type="text"
        id="videoUrlInput"
        placeholder="MP4 Video URL"
        value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
      />
      <input
        type="text"
        id="thumbUrlInput"
        placeholder="Thumbnail Image URL"
        value="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80"
      />
      <textarea id="videoDesc" rows="3" placeholder="Video ke baare mein likhein..."></textarea>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelUploadBtn">Cancel</button>
        <button type="submit" class="btn btn-danger">Publish</button>
      </div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "yt_clone_single_file_v1";

    const DEFAULT_VIDEOS = [
      {
        id: "1",
        title: "Web Development Roadmap in Hindi | HTML, CSS & JS",
        channel: "CodeWithArjun",
        subscribers: 124000,
        views: 84200,
        uploadedAt: "2 days ago",
        category: "Tech",
        duration: "18:42",
        thumbnail: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?w=800&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        description: "Is video mein hum modern web development ki shuruat, layout aur interactive UI banana seekhenge.",
        likes: 4200,
        comments: [
          { id: "c1", user: "Riya Sharma", text: "Bahut aasan aur clear samjhaya gaya hai!" },
          { id: "c2", user: "Vikram Patel", text: "Next video ka intezar rahega." }
        ]
      },
      {
        id: "2",
        title: "Lo-Fi Beats for Deep Focus & Study Session",
        channel: "ChillWave India",
        subscribers: 540000,
        views: 1205000,
        uploadedAt: "3 weeks ago",
        category: "Music",
        duration: "45:10",
        thumbnail: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
        description: "Padhai aur kaam ke dauran shant mahol ke liye relaxing beats.",
        likes: 39000,
        comments: [
          { id: "c3", user: "Aman Verma", text: "Coding karte waqt yeh bahut kaam aata hai." }
        ]
      },
      {
        id: "3",
        title: "Top 5 Open World Games You Must Play",
        channel: "PixelForge",
        subscribers: 89000,
        views: 215400,
        uploadedAt: "5 days ago",
        category: "Gaming",
        duration: "12:25",
        thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80",
        videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        description: "Open-world exploration, graphics aur story ke hisaab se best games.",
        likes: 9800,
        comments: []
      }
    ];

    const CATEGORIES = ["All", "Tech", "Music", "Gaming"];

    let state = loadState();

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.videos)) {
          return {
            videos: saved.videos,
            selectedCategory: saved.selectedCategory || "All",
            searchQuery: "",
            activeVideoId: null,
            likedIds: saved.likedIds || [],
            subscribedChannels: saved.subscribedChannels || []
          };
        }
      } catch (e) {
        // Ignore corrupt storage
      }
      return {
        videos: DEFAULT_VIDEOS,
        selectedCategory: "All",
        searchQuery: "",
        activeVideoId: null,
        likedIds: [],
        subscribedChannels: []
      };
    }

    function saveState() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          videos: state.videos,
          selectedCategory: state.selectedCategory,
          likedIds: state.likedIds,
          subscribedChannels: state.subscribedChannels
        })
      );
    }

    function formatViews(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, "") + "M views";
      if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, "") + "K views";
      return num + " views";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    const appEl = document.getElementById("app");
    const searchInput = document.getElementById("searchInput");
    const uploadModal = document.getElementById("uploadModal");
    const uploadForm = document.getElementById("uploadForm");

    function render() {
      if (state.activeVideoId) {
        renderWatchView();
      } else {
        renderHomeView();
      }
    }

    function renderHomeView() {
      const q = state.searchQuery.trim().toLowerCase();
      const filtered = state.videos.filter((v) => {
        const catMatch = state.selectedCategory === "All" || v.category === state.selectedCategory;
        const searchMatch =
          !q ||
          v.title.toLowerCase().includes(q) ||
          v.channel.toLowerCase().includes(q) ||
          v.category.toLowerCase().includes(q);
        return catMatch && searchMatch;
      });

      const chipsHtml = CATEGORIES.map(
        (cat) => `
          <button class="chip ${state.selectedCategory === cat ? "active" : ""}" data-cat="${escapeHtml(cat)}">
            ${escapeHtml(cat)}
          </button>
        `
      ).join("");

      const gridHtml = filtered.length
        ? filtered
            .map(
              (v) => `
                <div class="video-card" data-video-id="${escapeHtml(v.id)}">
                  <div class="thumb-wrap">
                    <img src="${escapeHtml(v.thumbnail)}" alt="${escapeHtml(v.title)}" loading="lazy" />
                    <span class="duration">${escapeHtml(v.duration)}</span>
                  </div>
                  <div>
                    <div class="video-title">${escapeHtml(v.title)}</div>
                    <div class="video-meta">${escapeHtml(v.channel)}</div>
                    <div class="video-meta">${formatViews(v.views)} • ${escapeHtml(v.uploadedAt)}</div>
                  </div>
                </div>
              `
            )
            .join("")
        : `<div class="empty-state">Koi video nahi mila. Search ya category badal kar dekhein.</div>`;

      appEl.innerHTML = `
        <div class="categories">${chipsHtml}</div>
        <div class="video-grid">${gridHtml}</div>
      `;

      appEl.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedCategory = btn.dataset.cat;
          saveState();
          render();
        });
      });

      appEl.querySelectorAll(".video-card").forEach((card) => {
        card.addEventListener("click", () => {
          openVideo(card.dataset.videoId);
        });
      });
    }

    function openVideo(videoId) {
      state.videos = state.videos.map((v) =>
        v.id === videoId ? { ...v, views: (Number(v.views) || 0) + 1 } : v
      );
      state.activeVideoId = videoId;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderWatchView() {
      const video = state.videos.find((v) => v.id === state.activeVideoId);
      if (!video) {
        state.activeVideoId = null;
        renderHomeView();
        return;
      }

      const isLiked = state.likedIds.includes(video.id);
      const isSub = state.subscribedChannels.includes(video.channel);
      const totalLikes = video.likes + (isLiked ? 1 : 0);
      const totalSubs = video.subscribers + (isSub ? 1 : 0);

      const otherVideos = state.videos.filter((v) => v.id !== video.id);
      const upNextHtml = otherVideos
        .map(
          (v) => `
            <div class="up-next-card" data-video-id="${escapeHtml(v.id)}">
              <img src="${escapeHtml(v.thumbnail)}" alt="${escapeHtml(v.title)}" />
              <div>
                <div class="video-title" style="font-size:14px;">${escapeHtml(v.title)}</div>
                <div class="video-meta" style="margin-top:4px;">${escapeHtml(v.channel)}</div>
                <div class="video-meta">${formatViews(v.views)}</div>
              </div>
            </div>
          `
        )
        .join("");

      const commentsHtml = video.comments.length
        ? video.comments
            .map(
              (c) => `
                <div class="comment-item">
                  <div class="comment-user">${escapeHtml(c.user)}</div>
                  <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
              `
            )
            .join("")
        : `<div class="video-meta">Abhi koi comment nahi hai. Pehla comment aap karein!</div>`;

      appEl.innerHTML = `
        <div style="margin-bottom:14px;">
          <button class="btn btn-secondary" id="backHomeBtn">← Home par waapas jayein</button>
        </div>
        <div class="watch-layout">
          <div class="player-box">
            <video src="${escapeHtml(video.videoUrl)}" controls autoplay></video>
            <h1 class="watch-title">${escapeHtml(video.title)}</h1>

            <div class="watch-bar">
              <div class="channel-info">
                <div class="avatar">${escapeHtml(video.channel.charAt(0).toUpperCase())}</div>
                <div>
                  <div style="font-weight:700;">${escapeHtml(video.channel)}</div>
                  <div class="video-meta">${totalSubs.toLocaleString()} subscribers</div>
                </div>
                <button class="btn ${isSub ? "btn-secondary" : "btn-light"}" id="subBtn">
                  ${isSub ? "Subscribed" : "Subscribe"}
                </button>
              </div>

              <button class="btn ${isLiked ? "btn-blue" : "btn-secondary"}" id="likeBtn">
                👍 ${totalLikes.toLocaleString()}
              </button>
            </div>

            <div class="desc-box">
              <div style="font-weight:600; margin-bottom:6px;">
                ${formatViews(video.views)} • ${escapeHtml(video.uploadedAt)} • ${escapeHtml(video.category)}
              </div>
              <p style="color:#ddd;">${escapeHtml(video.description)}</p>
            </div>

            <div class="comments-section">
              <h3>${video.comments.length} Comments</h3>
              <form class="comment-form" id="commentForm">
                <input type="text" id="commentInput" placeholder="Ek comment likhein..." required />
                <button type="submit" class="btn btn-blue">Post</button>
              </form>
              <div id="commentsList">${commentsHtml}</div>
            </div>
          </div>

          <aside class="up-next">
            <h4 style="font-size:15px;">Up Next</h4>
            ${upNextHtml || `<div class="video-meta">Aur videos uplabdh nahi hain.</div>`}
          </aside>
        </div>
      `;

      document.getElementById("backHomeBtn").addEventListener("click", () => {
        state.activeVideoId = null;
        render();
      });

      document.getElementById("subBtn").addEventListener("click", () => {
        if (isSub) {
          state.subscribedChannels = state.subscribedChannels.filter((ch) => ch !== video.channel);
        } else {
          state.subscribedChannels.push(video.channel);
        }
        saveState();
        renderWatchView();
      });

      document.getElementById("likeBtn").addEventListener("click", () => {
        if (isLiked) {
          state.likedIds = state.likedIds.filter((id) => id !== video.id);
        } else {
          state.likedIds.push(video.id);
        }
        saveState();
        renderWatchView();
      });

      document.getElementById("commentForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("commentInput");
        const text = input.value.trim();
        if (!text) return;

        state.videos = state.videos.map((v) =>
          v.id === video.id
            ? { ...v, comments: [{ id: String(Date.now()), user: "Aap", text }, ...v.comments] }
            : v
        );
        saveState();
        renderWatchView();
      });

      appEl.querySelectorAll(".up-next-card").forEach((card) => {
        card.addEventListener("click", () => openVideo(card.dataset.videoId));
      });
    }

    // Search
    searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      state.activeVideoId = null;
      renderHomeView();
    });

    // Logo click -> Home
    document.getElementById("homeLogo").addEventListener("click", () => {
      state.activeVideoId = null;
      state.selectedCategory = "All";
      state.searchQuery = "";
      searchInput.value = "";
      render();
    });

    // Reset default data
    document.getElementById("resetDataBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state = {
        videos: DEFAULT_VIDEOS,
        selectedCategory: "All",
        searchQuery: "",
        activeVideoId: null,
        likedIds: [],
        subscribedChannels: []
      };
      searchInput.value = "";
      render();
    });

    // Upload Modal controls
    document.getElementById("openUploadBtn").addEventListener("click", () => {
      uploadModal.classList.add("open");
    });

    document.getElementById("cancelUploadBtn").addEventListener("click", () => {
      uploadModal.classList.remove("open");
    });

    uploadModal.addEventListener("click", (e) => {
      if (e.target === uploadModal) uploadModal.classList.remove("open");
    });

    document.getElementById("videoFileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const blobUrl = URL.createObjectURL(file);
        document.getElementById("videoUrlInput").value = blobUrl;
      }
    });

    uploadForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("videoTitle").value.trim();
      if (!title) return;

      const newVideo = {
        id: String(Date.now()),
        title,
        channel: document.getElementById("channelName").value.trim() || "My Channel",
        subscribers: 1,
        views: 0,
        uploadedAt: "Abhi-abhi",
        category: document.getElementById("videoCategory").value,
        duration: "10:00",
        thumbnail:
          document.getElementById("thumbUrlInput").value.trim() ||
          "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80",
        videoUrl:
          document.getElementById("videoUrlInput").value.trim() ||
          "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        description: document.getElementById("videoDesc").value.trim() || "Naya upload kiya gaya video.",
        likes: 0,
        comments: []
      };

      state.videos = [newVideo, ...state.videos];
      saveState();
      uploadModal.classList.remove("open");
      uploadForm.reset();
      document.getElementById("channelName").value = "My Channel";
      openVideo(newVideo.id);
    });

    render();
  </script>
</body>
