
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AkyTube - Video Sharing</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<style>
:root{
  --bg:#f7f7f7;
  --card:#ffffff;
  --text:#171717;
  --muted:#777;
  --line:#e5e5e5;
  --accent:#e62117;
}
body.dark{
  --bg:#111;
  --card:#1d1d1d;
  --text:#f5f5f5;
  --muted:#aaa;
  --line:#333;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-size:24px;
  font-weight:bold;
  color:var(--accent);
  white-space:nowrap;
}
.search{
  flex:1;
  display:flex;
  max-width:650px;
  margin:auto;
}
.search input{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:22px 0 0 22px;
  background:var(--bg);
  color:var(--text);
}
.search button{
  padding:0 20px;
  border:1px solid var(--line);
  border-radius:0 22px 22px 0;
  background:var(--bg);
  color:var(--text);
}
.topbtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:20px;
}
.layout{display:flex}
.sidebar{
  width:220px;
  padding:15px 10px;
  position:fixed;
  top:64px;
  bottom:0;
  overflow:auto;
  background:var(--bg);
}
.sidebar button{
  width:100%;
  display:block;
  text-align:left;
  padding:13px;
  border:0;
  border-radius:9px;
  color:var(--text);
  background:transparent;
}
.sidebar button:hover{background:var(--line)}
main{
  margin-left:220px;
  width:calc(100% - 220px);
  padding:22px;
}
.categories{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:22px;
}
.categories button{
  border:0;
  padding:9px 16px;
  border-radius:20px;
  background:var(--line);
  color:var(--text);
  white-space:nowrap;
}
.categories button.active{
  background:var(--text);
  color:var(--bg);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:22px;
}
.video-card{
  min-width:0;
  cursor:pointer;
}
.thumb{
  width:100%;
  aspect-ratio:16/9;
  background:#222;
  border-radius:12px;
  object-fit:cover;
}
.video-info{padding:9px 2px}
.video-info h3{
  margin:0 0 7px;
  font-size:16px;
  line-height:1.4;
}
.video-info p{
  margin:4px 0;
  color:var(--muted);
  font-size:13px;
}
.primary{
  background:var(--accent);
  color:white;
  border:0;
  border-radius:22px;
  padding:10px 18px;
}
.secondary{
  background:var(--line);
  color:var(--text);
  border:0;
  border-radius:22px;
  padding:10px 16px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:30;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:var(--card);
  color:var(--text);
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:15px;
}
.modal-box h2{margin-top:0}
.field{margin:14px 0}
.field label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}
.field input,.field textarea,.field select{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
}
.field textarea{min-height:80px;resize:vertical}
#turnstileBox{margin-top:10px;min-height:65px}
.player{
  width:100%;
  max-height:70vh;
  background:#000;
  border-radius:12px;
}
.player-info{max-width:900px}
.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin:14px 0;
}
.comment{
  padding:12px 0;
  border-bottom:1px solid var(--line);
}
.comment small{color:var(--muted)}
.empty{color:var(--muted);padding:20px}
.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 20px;
  border-radius:25px;
  z-index:100;
  display:none;
  max-width:90%;
}
#pageTitle{margin-top:0}
.hidden{display:none!important}
footer{
  padding:25px;
  color:var(--muted);
  text-align:center;
}
@media(max-width:750px){
  header{padding:0 10px;gap:8px}
  .logo{font-size:19px}
  .sidebar{
    width:65px;
    padding:10px 4px;
  }
  .sidebar button{
    text-align:center;
    font-size:11px;
    padding:13px 2px;
  }
  main{
    margin-left:65px;
    width:calc(100% - 65px);
    padding:12px;
  }
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .video-info h3{font-size:14px}
  .search input{min-width:0}
  .topbtn{font-size:17px}
}
</style>
</head>

<body>

<header>
  <div class="logo" onclick="showPage('home')">▶ AkyTube</div>

  <div class="search">
    <input id="searchInput" placeholder="Search videos..." onkeydown="if(event.key==='Enter')searchVideos()">
    <button onclick="searchVideos()">🔍</button>
  </div>

  <button class="topbtn" onclick="openUpload()" title="Upload">⬆</button>
  <button class="topbtn" onclick="toggleTheme()" title="Theme">🌙</button>
</header>

<div class="layout">

<aside class="sidebar">
  <button onclick="showPage('home')">🏠 Home</button>
  <button onclick="showPage('shorts')">🎬 Shorts</button>
  <button onclick="showPage('subscriptions')">📺 Subscriptions</button>
  <hr>
  <button onclick="showPage('history')">🕘 History</button>
  <button onclick="showPage('watchlater')">⏱ Watch Later</button>
  <button onclick="showPage('playlists')">📂 Playlists</button>
  <button onclick="showPage('yourvideos')">📹 Your Videos</button>
  <hr>
  <button onclick="showPage('settings')">⚙ Settings</button>
</aside>

<main>
  <div class="categories" id="categories"></div>
  <h2 id="pageTitle">Home</h2>
  <div id="content"></div>
</main>

</div>

<!-- Upload Modal -->
<div class="modal" id="uploadModal">
  <div class="modal-box">
    <h2>Upload Video</h2>

    <div class="field">
      <label>Video Title *</label>
      <input id="fTitle" maxlength="100" placeholder="Enter video title">
    </div>

    <div class="field">
      <label>Choose MP4 Video *</label>
      <input type="file" id="fFile" accept=".mp4,video/mp4">
      <small>Maximum 8 MB | Maximum 60 seconds | MP4 only</small>
    </div>

    <div class="field">
      <label>Channel Name</label>
      <input id="fChan" value="Ashok Kumar Yadaw">
    </div>

    <div class="field">
      <label>Category</label>
      <select id="fCat">
        <option>Entertainment</option>
        <option>Education</option>
        <option>Music</option>
        <option>News</option>
        <option>Technology</option>
        <option>Gaming</option>
        <option>Sports</option>
        <option>Shorts</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label>Description</label>
      <textarea id="fDesc" maxlength="2000" placeholder="Video description"></textarea>
    </div>

    <div class="field">
      <label>Thumbnail Image URL (Optional)</label>
      <input id="fThumb" placeholder="https://example.com/image.jpg">
    </div>

    <div class="field">
      <label>Security Verification</label>
      <div id="turnstileBox"></div>
    </div>

    <button class="primary" id="publishBtn" onclick="uploadVideo()">Publish Video</button>
    <button class="secondary" onclick="closeModal('uploadModal')">Cancel</button>
  </div>
</div>

<!-- Player Modal -->
<div class="modal" id="playerModal">
  <div class="modal-box" style="max-width:950px">
    <button class="secondary" onclick="closeModal('playerModal')">✕ Close</button>
    <video id="mainPlayer" class="player" controls playsinline></video>
    <div class="player-info">
      <h2 id="playerTitle"></h2>
      <p id="playerChannel"></p>
      <div class="player-actions">
        <button class="secondary" id="likeBtn" onclick="toggleLike()">👍 Like</button>
        <button class="secondary" onclick="toggleDislike()">👎 Dislike</button>
        <button class="secondary" onclick="subscribeChannel()">Subscribe</button>
        <button class="secondary" onclick="saveWatchLater()">⏱ Watch Later</button>
        <button class="secondary" onclick="shareVideo()">↗ Share</button>
      </div>
      <p id="playerDescription"></p>
      <hr>
      <h3>Comments</h3>
      <div class="field">
        <input id="commentInput" placeholder="Write a comment...">
        <button class="primary" onclick="addComment()">Comment</button>
      </div>
      <div id="commentsList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer>
  AkyTube · Video Sharing Platform
  <br>Designed by Ashok Kumar Yadaw
</footer>

<script>
"use strict";

/* ================= CONFIGURATION ================= */

const UPLOAD_API =
  "https://akytube.ashokyadawji.workers.dev";

const TURNSTILE_SITE_KEY =
  "0x4AAAAAAGNFRaEkymrkl9UQ";

const VIDEO_MANIFEST =
  "https://raw.githubusercontent.com/Ashok-Kumar-Yadaw/akytube/main/videos.json";

const FALLBACK =
  "https://placehold.co/640x360/222/fff?text=AkyTube";

/* ================= APPLICATION DATA ================= */

let videos = [];
let current = null;
let currentPage = "home";
let activeCategory = "All";

let turnstileWidgetId = null;
let turnstileToken = "";

let likes = JSON.parse(localStorage.getItem("aky_likes") || "[]");
let dislikes = JSON.parse(localStorage.getItem("aky_dislikes") || "[]");
let subscriptions = JSON.parse(localStorage.getItem("aky_subs") || "[]");
let watchLater = JSON.parse(localStorage.getItem("aky_watchlater") || "[]");
let history = JSON.parse(localStorage.getItem("aky_history") || "[]");
let uploads = JSON.parse(localStorage.getItem("aky_uploads") || "[]");
let playlists = JSON.parse(localStorage.getItem("aky_playlists") || "{}");
let comments = JSON.parse(localStorage.getItem("aky_comments") || "{}");

function persist(){
  localStorage.setItem("aky_likes",JSON.stringify(likes));
  localStorage.setItem("aky_dislikes",JSON.stringify(dislikes));
  localStorage.setItem("aky_subs",JSON.stringify(subscriptions));
  localStorage.setItem("aky_watchlater",JSON.stringify(watchLater));
  localStorage.setItem("aky_history",JSON.stringify(history));
  localStorage.setItem("aky_uploads",JSON.stringify(uploads));
  localStorage.setItem("aky_playlists",JSON.stringify(playlists));
  localStorage.setItem("aky_comments",JSON.stringify(comments));
}

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.akyToastTimer);
  window.akyToastTimer=setTimeout(()=>el.style.display="none",3000);
}

function closeModal(id){
  document.getElementById(id).style.display="none";
}

/* ================= TURNSTILE ================= */

function setupTurnstile(){
  if(turnstileWidgetId !== null) return;

  if(!window.turnstile){
    setTimeout(setupTurnstile,500);
    return;
  }

  turnstileWidgetId=window.turnstile.render("#turnstileBox",{
    sitekey:TURNSTILE_SITE_KEY,
    theme:document.body.classList.contains("dark")?"dark":"light",

    callback:function(token){
      turnstileToken=token;
    },

    "expired-callback":function(){
      turnstileToken="";
      toast("CAPTCHA expired. Please verify again.");
    },

    "error-callback":function(){
      turnstileToken="";
      toast("CAPTCHA verification error");
    }
  });
}

function openUpload(){
  document.getElementById("uploadModal").style.display="flex";
  setupTurnstile();
}

/* ================= VIDEO UPLOAD ================= */

async function getVideoDuration(file){
  const url=URL.createObjectURL(file);

  try{
    const duration=await new Promise((resolve,reject)=>{
      const video=document.createElement("video");
      video.preload="metadata";

      video.onloadedmetadata=()=>resolve(video.duration);
      video.onerror=()=>reject(new Error("Invalid video file"));

      video.src=url;
    });

    return duration;
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function uploadVideo(){
  const btn=document.getElementById("publishBtn");
  const title=document.getElementById("fTitle").value.trim();
  const file=document.getElementById("fFile").files[0];

  if(!title){
    toast("Please enter video title");
    return;
  }

  if(!file){
    toast("Please select an MP4 video");
    return;
  }

  if(!file.name.toLowerCase().endsWith(".mp4") ||
     (file.type && file.type!=="video/mp4")){
    toast("Only MP4 videos are allowed");
    return;
  }

  if(file.size>8*1024*1024){
    toast("Maximum file size is 8 MB");
    return;
  }

  if(!turnstileToken){
    toast("Please complete CAPTCHA verification");
    return;
  }

  btn.disabled=true;
  btn.textContent="Checking video...";

  try{
    const duration=await getVideoDuration(file);

    if(duration>60){
      throw new Error("Maximum video duration is 60 seconds");
    }

    const formData=new FormData();

    formData.append("file",file);
    formData.append("title",title);
    formData.append("channel",
      document.getElementById("fChan").value.trim() ||
      "Ashok Kumar Yadaw"
    );
    formData.append("category",document.getElementById("fCat").value);
    formData.append("description",document.getElementById("fDesc").value);
    formData.append("thumb",document.getElementById("fThumb").value.trim());
    formData.append("turnstileToken",turnstileToken);

    btn.textContent="Uploading...";

    const response=await fetch(UPLOAD_API,{
      method:"POST",
      body:formData
    });

    let result;

    try{
      result=await response.json();
    }catch{
      throw new Error("Worker returned an invalid response");
    }

    if(!response.ok || result.success!==true){
      throw new Error(result.error || "Upload failed");
    }

    const uploaded=result.video || result.data || result;

    const videoUrl=
      uploaded.url ||
      uploaded.videoUrl ||
      uploaded.rawUrl ||
      uploaded.download_url;

    if(!videoUrl){
      throw new Error("Worker response does not contain video URL");
    }

    const newVideo={
      id:String(uploaded.id || ("u"+Date.now())),
      title:uploaded.title || title,
      channel:uploaded.channel ||
        document.getElementById("fChan").value.trim() ||
        "Ashok Kumar Yadaw",
      category:uploaded.category || document.getElementById("fCat").value,
      url:videoUrl,
      thumb:uploaded.thumb ||
        document.getElementById("fThumb").value.trim() ||
        FALLBACK,
      description:uploaded.description ||
        document.getElementById("fDesc").value,
      views:0
    };

    videos.unshift(newVideo);

    uploads.push(newVideo.id);
    persist();

    document.getElementById("fTitle").value="";
    document.getElementById("fFile").value="";
    document.getElementById("fDesc").value="";
    document.getElementById("fThumb").value="";

    turnstileToken="";

    if(window.turnstile && turnstileWidgetId!==null){
      window.turnstile.reset(turnstileWidgetId);
    }

    closeModal("uploadModal");
    showPage("yourvideos");
    toast("Video successfully published!");

  }catch(error){
    console.error(error);
    toast(error.message || "Upload failed");

    turnstileToken="";

    if(window.turnstile && turnstileWidgetId!==null){
      window.turnstile.reset(turnstileWidgetId);
    }

  }finally{
    btn.disabled=false;
    btn.textContent="Publish Video";
  }
}

/* ================= LOAD PUBLIC VIDEOS ================= */

async function loadPublicVideos(){
  try{
    const response=await fetch(VIDEO_MANIFEST,{
      cache:"no-store"
    });

    if(!response.ok) return;

    const data=await response.json();

    const list=Array.isArray(data)
      ? data
      : (Array.isArray(data.videos)?data.videos:[]);

    const remote=list.map(item=>({
      id:String(item.id || item.path || item.url || Math.random()),
      title:item.title || "Untitled Video",
      channel:item.channel || "AkyTube Creator",
      category:item.category || "Other",
      url:item.url || item.videoUrl || item.rawUrl || item.download_url || "",
      thumb:item.thumb || item.thumbnail || FALLBACK,
      description:item.description || "",
      views:item.views || 0
    })).filter(v=>v.url);

    const localIds=new Set(videos.map(v=>String(v.id)));

    remote.forEach(v=>{
      if(!localIds.has(String(v.id))){
        videos.push(v);
      }
    });

    renderPage();
  }catch(error){
    console.warn("Public video manifest could not be loaded",error);
  }
}

/* ================= CATEGORIES ================= */

const categoryNames=[
  "All","Entertainment","Education","Music","News",
  "Technology","Gaming","Sports","Shorts","Other"
];

function renderCategories(){
  const el=document.getElementById("categories");

  el.innerHTML=categoryNames.map(c=>`
    <button class="${activeCategory===c?"active":""}"
      onclick="setCategory('${safe(c)}')">${safe(c)}</button>
  `).join("");
}

function setCategory(category){
  activeCategory=category;
  renderCategories();
  showPage("home");
}

/* ================= VIDEO CARDS ================= */

function videoCard(v){
  return `
    <div class="video-card" onclick="playVideo('${safe(v.id)}')">
      <img class="thumb"
        src="${safe(v.thumb || FALLBACK)}"
        alt="${safe(v.title)}"
        onerror="this.src='${FALLBACK}'">

      <div class="video-info">
        <h3>${safe(v.title)}</h3>
        <p>${safe(v.channel)}</p>
        <p>${Number(v.views||0).toLocaleString()} views</p>
        <p>${safe(v.category || "Other")}</p>
      </div>
    </div>
  `;
}

function renderGrid(list){
  const el=document.getElementById("content");

  if(!list.length){
    el.innerHTML='<div class="empty">No videos found.</div>';
    return;
  }

  el.innerHTML='<div class="grid">'+list.map(videoCard).join("")+'</div>';
}

/* ================= PAGE NAVIGATION ================= */

function showPage(page){
  currentPage=page;
  activeCategory="All";
  renderCategories();
  renderPage();
}

function renderPage(){
  const title=document.getElementById("pageTitle");
  const el=document.getElementById("content");

  let list=[...videos];

  if(currentPage==="home"){
    title.textContent="Home";
    if(activeCategory!=="All"){
      list=list.filter(v=>v.category===activeCategory);
    }
    renderGrid(list);
    return;
  }

  if(currentPage==="shorts"){
    title.textContent="Shorts";
    list=list.filter(v=>
      v.category==="Shorts" ||
      v.category==="Entertainment"
    );
    renderGrid(list);
    return;
  }

  if(currentPage==="subscriptions"){
    title.textContent="Subscriptions";
    list=list.filter(v=>subscriptions.includes(v.channel));
    renderGrid(list);
    return;
  }

  if(currentPage==="history"){
    title.textContent="Watch History";
    list=history.map(id=>videos.find(v=>String(v.id)===String(id))).filter(Boolean);
    renderGrid(list);
    return;
  }

  if(currentPage==="watchlater"){
    title.textContent="Watch Later";
    list=watchLater.map(id=>videos.find(v=>String(v.id)===String(id))).filter(Boolean);
    renderGrid(list);
    return;
  }

  if(currentPage==="yourvideos"){
    title.textContent="Your Videos";
    list=uploads.map(id=>videos.find(v=>String(v.id)===String(id))).filter(Boolean);
    renderGrid(list);
    return;
  }

  if(currentPage==="playlists"){
    title.textContent="Playlists";

    let html=`
      <div class="field">
        <input id="newPlaylist" placeholder="New playlist name">
        <button class="primary" onclick="createPlaylist()">Create Playlist</button>
      </div>
    `;

    Object.keys(playlists).forEach(name=>{
      const items=(playlists[name]||[])
        .map(id=>videos.find(v=>String(v.id)===String(id)))
        .filter(Boolean);

      html+=`
        <h3>${safe(name)}</h3>
        ${items.length
          ? '<div class="grid">'+items.map(videoCard).join("")+'</div>'
          : '<p class="empty">This playlist is empty.</p>'}
      `;
    });

    el.innerHTML=html;
    return;
  }

  if(currentPage==="settings"){
    title.textContent="Settings";
    el.innerHTML=`
      <h3>AkyTube Settings</h3>
      <p>Theme: ${document.body.classList.contains("dark")?"Dark":"Light"}</p>
      <button class="secondary" onclick="toggleTheme()">Change Theme</button>
      <hr>
      <p>Public uploads are stored using the AkyTube Cloudflare Worker and GitHub repository.</p>
      <p>Maximum upload: MP4, 8 MB, 60 seconds.</p>
      <button class="secondary" onclick="loadPublicVideos()">Refresh Public Videos</button>
    `;
    return;
  }
}

/* ================= SEARCH ================= */

function searchVideos(){
  const query=document.getElementById("searchInput").value.trim().toLowerCase();

  if(!query){
    showPage("home");
    return;
  }

  currentPage="search";
  document.getElementById("pageTitle").textContent="Search Results";

  const list=videos.filter(v=>
    (v.title+" "+v.channel+" "+v.category+" "+v.description)
      .toLowerCase().includes(query)
  );

  renderGrid(list);
}

/* ================= PLAYER ================= */

function playVideo(id){
  const video=videos.find(v=>String(v.id)===String(id));
  if(!video) return;

  current=video;

  const player=document.getElementById("mainPlayer");
  player.src=video.url;

  document.getElementById("playerTitle").textContent=video.title;
  document.getElementById("playerChannel").textContent=video.channel;
  document.getElementById("playerDescription").textContent=video.description || "";

  document.getElementById("playerModal").style.display="flex";

  history=[String(video.id),...history.filter(x=>String(x)!==String(video.id))].slice(0,100);
  persist();

  renderComments();
  updateLikeButton();
}

function toggleLike(){
  if(!current) return;

  const id=String(current.id);

  likes=likes.filter(x=>String(x)!==id);

  if(!current._liked){
    likes.push(id);
  }

  current._liked=!current._liked;
  current._disliked=false;

  dislikes=dislikes.filter(x=>String(x)!==id);

  persist();
  updateLikeButton();
}

function toggleDislike(){
  if(!current) return;

  const id=String(current.id);

  dislikes=dislikes.filter(x=>String(x)!==id);

  if(!current._disliked){
    dislikes.push(id);
  }

  current._disliked=!current._disliked;
  current._liked=false;

  likes=likes.filter(x=>String(x)!==id);

  persist();
  updateLikeButton();
}

function updateLikeButton(){
  if(!current) return;

  const id=String(current.id);
  document.getElementById("likeBtn").textContent=
    (likes.includes(id)?"👍 Liked":"👍 Like")+
    " ("+likes.length+")";
}

function subscribeChannel(){
  if(!current) return;

  const channel=current.channel;

  if(subscriptions.includes(channel)){
    subscriptions=subscriptions.filter(x=>x!==channel);
    toast("Unsubscribed");
  }else{
    subscriptions.push(channel);
    toast("Subscribed!");
  }

  persist();
}

function saveWatchLater(){
  if(!current) return;

  const id=String(current.id);

  if(!watchLater.includes(id)){
    watchLater.push(id);
    persist();
    toast("Added to Watch Later");
  }else{
    toast("Already in Watch Later");
  }
}

/* ================= COMMENTS ================= */

function addComment(){
  if(!current) return;

  const input=document.getElementById("commentInput");
  const text=input.value.trim();

  if(!text) return;

  const id=String(current.id);

  if(!comments[id]) comments[id]=[];

  comments[id].push({
    text:text,
    date:new Date().toLocaleString()
  });

  input.value="";
  persist();
  renderComments();
}

function renderComments(){
  if(!current) return;

  const list=comments[String(current.id)]||[];

  document.getElementById("commentsList").innerHTML=
    list.length
    ? list.map(c=>`
      <div class="comment">
        <b>AkyTube User</b>
        <p>${safe(c.text)}</p>
        <small>${safe(c.date)}</small>
      </div>
    `).join("")
    : '<p class="empty">No comments yet.</p>';
}

/* ================= PLAYLISTS ================= */

function createPlaylist(){
  const input=document.getElementById("newPlaylist");
  const name=input.value.trim();

  if(!name) return;

  if(playlists[name]){
    toast("Playlist already exists");
    return;
  }

  playlists[name]=[];
  persist();
  renderPage();
  toast("Playlist created");
}

/* ================= SHARE ================= */

function shareVideo(){
  if(!current) return;

  const url=location.origin+location.pathname+
    "#video="+encodeURIComponent(current.id);

  if(navigator.share){
    navigator.share({
      title:current.title,
      url:url
    }).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(url);
    toast("Video link copied");
  }else{
    toast(url);
  }
}

/* ================= THEME ================= */

function toggleTheme(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "aky_theme",
    document.body.classList.contains("dark")?"dark":"light"
  );
}

if(localStorage.getItem("aky_theme")==="dark"){
  document.body.classList.add("dark");
}

/* ================= INITIALIZATION ================= */

renderCategories();
renderPage();
loadPublicVideos();

window.addEventListener("load",()=>{
  const hash=location.hash;

  if(hash.startsWith("#video=")){
    const id=decodeURIComponent(hash.substring(7));

    setTimeout(()=>{
      const video=videos.find(v=>String(v.id)===id);
      if(video) playVideo(id);
    },1500);
  }
});

document.querySelectorAll(".modal").forEach(modal=>{
  modal.addEventListener("click",event=>{
    if(event.target===modal){
      modal.style.display="none";
    }
  });
});

</script>
