<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AkyTube - Video Streaming Platform</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #181818;
      --bg-hover: #272727;
      --bg-chip: #222222;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #ff0000;
      --accent-hover: #cc0000;
      --border: #303030;
    }

    body.light-mode {
      --bg-primary: #ffffff;
      --bg-secondary: #f9f9f9;
      --bg-hover: #e5e5e5;
      --bg-chip: #f2f2f2;
      --text-primary: #0f0f0f;
      --text-secondary: #606060;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 50%;
    }

    .icon-btn:hover { background: var(--bg-hover); }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      color: var(--text-primary);
      text-decoration: none;
    }

    .play-badge {
      background: var(--accent);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 520px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px 0 0 20px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      outline: none;
      font-size: 14px;
    }

    .search-box button {
      padding: 8px 16px;
      border-radius: 0 20px 20px 0;
      border: 1px solid var(--border);
      border-left: none;
      background: var(--bg-chip);
      color: var(--text-primary);
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-primary);
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .btn:hover { background: var(--bg-hover); }

    .btn-red {
      background: var(--accent);
      color: #ffffff;
      border: none;
    }

    .btn-red:hover { background: var(--accent-hover); }

    /* Layout */
    .wrapper {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    .sidebar {
      width: 215px;
      border-right: 1px solid var(--border);
      padding: 12px 8px;
      flex-shrink: 0;
    }

    .sidebar.mini { width: 68px; }
    .sidebar.mini .label-txt { display: none; }

    .side-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .side-link:hover, .side-link.active {
      background: var(--bg-hover);
      font-weight: bold;
    }

    .content {
      flex: 1;
      padding: 16px 20px;
    }

    /* Chips */
    .chip-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .chip {
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: none;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .chip.active, .chip:hover {
      background: var(--text-primary);
      color: var(--bg-primary);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      cursor: pointer;
    }

    .thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 10px;
      overflow: hidden;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dur-tag {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-body {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .card-meta h4 {
      font-size: 15px;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-meta p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Watch Section */
    .watch-view {
      display: none;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    .watch-view.show { display: grid; }

    video#player {
      width: 100%;
      max-height: 500px;
      background: #000000;
      border-radius: 10px;
    }

    .w-title {
      font-size: 19px;
      margin: 12px 0;
    }

    .w-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .ch-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sub-btn {
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .sub-btn.done {
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .desc-card {
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 13px;
    }

    .comment-box { margin-top: 18px; }
    .c-form {
      display: flex;
      gap: 8px;
      margin: 10px 0 16px;
      flex-wrap: wrap;
    }
    .c-form input {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .c-item {
      display: flex;
      gap: 10px;
      background: var(--bg-secondary);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .next-card {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .next-card img {
      width: 140px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 14px;
    }

    .modal-bg.open { display: flex; }

    .modal-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
    }

    @media (max-width: 850px) {
      .watch-view.show { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo-wrap">
      <button class="icon-btn" onclick="toggleMenu()">☰</button>
      <a class="brand" onclick="showHome()">
        <span class="play-badge">▶</span> AkyTube
      </a>
    </div>

    <div class="search-box">
      <input type="text" id="searchBox" placeholder="Search videos..." onkeyup="renderVideos()" />
      <button onclick="renderVideos()">🔍</button>
    </div>

    <div class="actions">
      <button class="btn btn-red" onclick="openModal()">+ Upload</button>
      <button class="btn" onclick="resetAll()">Reset</button>
      <button class="btn" id="modeBtn" onclick="switchTheme()">☀️</button>
    </div>
  </div>

  <div class="wrapper">
    <div class="sidebar" id="sideNav">
      <div class="side-link active" onclick="setNav('all', this)">🏠 <span class="label-txt">Home</span></div>
      <div class="side-link" onclick="setNav('trending', this)">🔥 <span class="label-txt">Trending</span></div>
      <div class="side-link" onclick="setNav('subs', this)">📺 <span class="label-txt">Subscriptions</span></div>
      <div class="side-link" onclick="setNav('history', this)">📜 <span class="label-txt">History</span></div>
      <div class="side-link" onclick="setNav('later', this)">⏰ <span class="label-txt">Watch Later</span></div>
