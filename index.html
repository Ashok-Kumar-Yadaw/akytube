<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AkyTube - Video Streaming Platform</title>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-card: #181818;
      --bg-hover: #272727;
      --bg-chip: #222222;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --red: #ff0000;
      --border: #303030;
    }
    body.light {
      --bg-main: #ffffff;
      --bg-card: #f4f4f4;
      --bg-hover: #e2e2e2;
      --bg-chip: #eeeeee;
      --text-main: #0f0f0f;
      --text-sub: #555555;
      --border: #dddddd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); }

    .header {
      position: sticky; top: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: var(--bg-main); border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .logo-box { display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .logo span { background: var(--red); color: #fff; padding: 2px 7px; border-radius: 5px; font-size: 13px; }
    .search-wrap { display: flex; flex: 1; max-width: 500px; }
    .search-wrap input {
      width: 100%; padding: 8px 14px; border-radius: 20px 0 0 20px;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); outline: none;
    }
    .search-wrap button {
      padding: 8px 16px; border-radius: 0 20px 20px 0;
      border: 1px solid var(--border); border-left: none; background: var(--bg-chip); color: var(--text-main); cursor: pointer;
    }
    .btn {
      padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-chip); color: var(--text-main); cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn-red { background: var(--red); color: #fff; border: none; }

    .container { display: flex; min-height: calc(100vh - 54px); }
    .sidebar { width: 200px; border-right: 1px solid var(--border); padding: 10px; flex-shrink: 0; }
    .sidebar.hide { display: none; }
    .nav-btn {
      display: block; width: 100%; text-align: left; padding: 10px 12px;
      background: none; border: none; color: var(--text-main); border-radius: 8px;
      cursor: pointer; font-size: 14px; margin-bottom: 4px;
    }
    .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); font-weight: bold; }

    .main-area { flex: 1; padding: 16px; }

    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; }
    .cat-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      background: var(--bg-chip); color: var(--text-main); cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    .cat-btn.active { background: var(--text-main); color: var(--bg-main); font-weight: bold; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
    .v-card { cursor: pointer; }
    .thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
    .v-info { display: flex; gap: 10px; margin-top: 8px; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0;
    }
    .v-info h4 { font-size: 14px; margin-bottom: 3px; }
    .v-info p { font-size: 12px; color: var(--text-sub); }

    .watch-box { display: none; grid-template-columns: 1fr 320px; gap: 20px; }
    .watch-box.active { display: grid; }
    video { width: 100%; max-height: 480px; background: #000; border-radius: 10px; }
    .w-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .sub-btn { background: var(--text-main); color: var(--bg-main); border: none; padding: 7px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .sub-btn.subbed { background: var(--bg-chip); color: var(--text-main); border: 1px solid var(--border); }
    .desc-panel { background: var(--bg-card); padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
    .comment-form { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .comment-form input { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); }
    .comment-card { display: flex; gap: 10px; background: var(--bg-card); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .next-item { display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer; }
    .next-item img { width: 130px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 14px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      width: 100%; max-width: 460px; padding: 20px; max-height: 90vh; overflow-y: auto;
    }
    .inp-group { margin-bottom: 12px; }
    .inp-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .inp-group input, .inp-group select, .inp-group textarea {
      width: 100%; padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 14px;
    }

    @media (max-width: 800px) {
      .watch-box.active { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: 0; top: 54px; bottom: 0; background: var(--bg-main); z-index: 40; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-box">
      <button class="btn" onclick="toggleMenu()">☰</button>
      <div class="logo" onclick="goHome()"><span>▶</span> AkyTube</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="वीडियो या चैनल खोजें..." oninput="drawGrid()" />
      <button onclick="drawGrid()">🔍</button>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-red" onclick="openUpload()">+ Upload</button>
      <button class="btn" onclick="resetApp()">Reset</button>
      <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    </div>
  </div>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <button class="nav-btn active" onclick="setTab('all', this)">🏠 होम (Home)</button>
      <button class="nav-btn" onclick="setTab('trending', this)">🔥 ट्रेंडिंग (Trending)</button>
      <button class="nav-btn" onclick="setTab('subs', this)">📺 सब्सक्रिप्शन</button>
      <button class="nav-btn" onclick="setTab('history', this)">📜 वॉच हिस्ट्री</button>
      <button class="nav-btn" onclick="setTab('later', this)">⏰ बाद में देखें</button>
      <button class="nav-btn" onclick="setTab('liked', this)">👍 पसंद किए गए</button>
    </div>

    <div class="main-area">
      <div id="homeView">
        <div class="cats">
          <button class="cat-btn active" onclick="setCategory('All', this)">सभी (All)</button>
          <button class="cat-btn" onclick="setCategory('My Channel', this)">My Channel</button>
          <button class="cat-btn" onclick="setCategory('Tech', this)">Tech</button>
          <button class="cat-btn" onclick="setCategory('Music', this)">Music</button>
          <button class="cat-btn" onclick="setCategory('Gaming', this)">Gaming</button>
          <button class="cat-btn" onclick="setCategory('Education', this)">Education</button>
        </div>
        <div class="video-grid" id="videoGrid"></div>
      </div>

      <div class="watch-box" id="watchView">
        <div>
          <button class="btn" onclick="goHome()" style="margin-bottom:10px;">← होम पर वापस जाएं</button>
          <video id="videoPlayer" controls></video>
          <h2 id="wTitle" style="margin-top:10px; font-size:18px;">Title</h2>

          <div class="w-bar">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="avatar" id="wAvatar">A</div>
              <div>
                <strong id="wChannel">Channel</strong>
                <div style="font-size:12px; color:var(--text-sub);">1.5K सब्सक्राइबर्स</div>
              </div>
              <button class="sub-btn" id="subBtn" onclick="toggleSubscribe()">Subscribe</button>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <button class="btn" id="likeBtn" onclick="toggleLike()">👍 <span id="likeCount">0</span></button>
              <button class="btn" id="laterBtn" onclick="toggleLater()">⏰ Save</button>
              <button class="btn" onclick="shareLink()">🔗 Share</button>
              <button class="btn" onclick="deleteVideo()" style="color:#ff5555;">🗑️ Delete</button>
            </div>
          </div>

          <div class="desc-panel">
            <strong id="wMeta">0 views</strong>
            <p id="wDesc" style="margin-top:6px;"></p>
          </div>

          <div style="margin-top:16px;">
            <h3 id="cHeading">कमेंट्स</h3>
            <div class="comment-form">
              <input type="text" id="cUser" placeholder="आपका नाम" style="max-width:130px;" />
