<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AkyTube - Video Streaming Platform</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #181818;
      --bg-hover: #272727;
      --bg-chip: #222222;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #ff0000;
      --accent-hover: #cc0000;
      --border: #303030;
    }

    body.light-mode {
      --bg-primary: #ffffff;
      --bg-secondary: #f9f9f9;
      --bg-hover: #e5e5e5;
      --bg-chip: #f2f2f2;
      --text-primary: #0f0f0f;
      --text-secondary: #606060;
      --border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.2s, color 0.2s;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 50%;
    }

    .menu-btn:hover { background: var(--bg-hover); }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-icon {
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .search-bar {
      display: flex;
      flex: 1;
      max-width: 550px;
    }

    .search-bar input {
      width: 100%;
      padding: 9px 16px;
      border-radius: 20px 0 0 20px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      outline: none;
      font-size: 15px;
    }

    .search-bar input:focus { border-color: #1c62b9; }

    .search-bar button {
      padding: 9px 18px;
      border-radius: 0 20px 20px 0;
      border: 1px solid var(--border);
      border-left: none;
      background: var(--bg-chip);
      color: var(--text-primary);
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-primary);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--bg-hover); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    /* Main Layout */
    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
    }

    /* Sidebar */
    aside {
      width: 225px;
      background: var(--bg-primary);
      border-right: 1px solid var(--border);
      padding: 12px 8px;
      flex-shrink: 0;
    }

    aside.collapsed { width: 72px; }
    aside.collapsed .nav-text, aside.collapsed .side-heading { display: none; }

    .side-heading {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 8px 14px 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .nav-item:hover, .nav-item.active { background: var(--bg-hover); font-weight: 600; }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    /* Main Content */
    main {
      flex: 1;
      padding: 16px 24px;
      overflow-y: auto;
    }

    /* Category Chips */
    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--bg-chip);
      color: var(--text-primary);
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    .chip.active, .chip:hover {
      background: var(--text-primary);
      color: var(--bg-primary);
    }

    /* Video Grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .video-card {
      cursor: pointer;
      transition: transform 0.15s;
    }

    .video-card:hover { transform: translateY(-2px); }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-info {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .meta h4 {
      font-size: 15px;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Watch Player Page */
    .watch-container {
      display: none;
      grid-template-columns: 1fr 360px;
      gap: 24px;
    }

    .watch-container.active { display: grid; }

    .player-box video {
      width: 100%;
      max-height: 540px;
      background: #000;
      border-radius: 12px;
    }

    .watch-title {
      font-size: 20px;
      margin: 14px 0 10px;
    }

    .watch-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .channel-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sub-btn {
      background: var(--text-primary);
      color: var(--bg-primary);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .sub-btn.subscribed {
      background: var(--bg-chip);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .action-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .desc-box {
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Comments Section */
    .comments-section { margin-top: 20px; }
    .comment-form {
      display: flex;
      gap: 10px;
      margin: 12px 0 18px;
      flex-wrap: wrap;
    }
    .comment-form input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .comment-item {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 14px;
      background: var(--bg-secondary);
      padding: 10px;
      border-radius: 8px;
    }

    /* Up Next List */
    .up-next-item {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .up-next-item img {
      width: 150px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Upload Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 { margin-bottom: 14px; }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: var(--text-secondary);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
    }

    .github-box {
      background: rgba(255, 0, 0, 0.08);
      border: 1px dashed var(--accent);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    #uploadStatus {
      font-size: 13px;
      color: #4caf50;
      margin-top: 8px;
      display: none;
    }
